name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Syntax check (src, worker, scripts)
        run: |
          set -e
          for f in $(git ls-files 'src/*.js' 'worker/*.js' 'scripts/*.js'); do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate client config JSON
        run: |
          set -e
          for f in $(git ls-files 'clients/*.json'); do
            echo "Validating $f"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"
          done

      - name: Worker pre-deploy sanity checks
        run: npm run pre-deploy
