name: Post to LinkedIn

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client ID (irfan / alex — filters to their latest draft)'
        required: false
      draft_path:
        description: 'Exact draft file path (leave blank to auto-find latest)'
        required: false
      image_keys:
        description: 'Comma-separated Worker KV keys for image(s) attached via WhatsApp (leave blank for text-only)'
        required: false
      document_key:
        description: 'Worker KV key for a PDF document attached via WhatsApp (posts as a document/carousel share)'
        required: false

permissions: {}

concurrency:
  group: auto-poster-git
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Post to LinkedIn
        env:
          IRFAN_LINKEDIN_ACCESS_TOKEN:     ${{ secrets.IRFAN_LINKEDIN_ACCESS_TOKEN }}
          IRFAN_LINKEDIN_PERSON_URN:       ${{ secrets.IRFAN_LINKEDIN_PERSON_URN }}
          IRFAN_LINKEDIN_TOKEN_EXPIRES_AT: ${{ secrets.IRFAN_LINKEDIN_TOKEN_EXPIRES_AT }}
          ALEX_LINKEDIN_ACCESS_TOKEN:      ${{ secrets.ALEX_LINKEDIN_ACCESS_TOKEN }}
          ALEX_LINKEDIN_PERSON_URN:        ${{ secrets.ALEX_LINKEDIN_PERSON_URN }}
          ALEX_LINKEDIN_TOKEN_EXPIRES_AT:  ${{ secrets.ALEX_LINKEDIN_TOKEN_EXPIRES_AT }}
          WHATSAPP_ACCESS_TOKEN:           ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID:        ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT_NUMBER:       ${{ secrets.WHATSAPP_RECIPIENT_NUMBER }}
          WORKER_URL:                      ${{ secrets.WORKER_URL }}
          WORKER_CALLBACK_SECRET:          ${{ secrets.WORKER_CALLBACK_SECRET }}
          INPUT_CLIENT:                    ${{ inputs.client }}
          INPUT_DRAFT_PATH:                ${{ inputs.draft_path }}
          INPUT_IMAGE_KEYS:                ${{ inputs.image_keys }}
          INPUT_DOCUMENT_KEY:              ${{ inputs.document_key }}
        run: node src/post.js

      - name: Commit posted status
        run: |
          set -e
          git config user.name  "Auto-Poster Bot"
          git config user.email "bot@auto-poster.local"
          git add -f drafts/*.json
          if ! git diff --staged --quiet; then
            git commit -m "posted: $(date -u +%Y-%m-%dT%H:%M:%S)"
            n=0
            until git pull --rebase --autostash origin main && git push; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::git push failed after $n attempts"
                exit 1
              fi
              echo "Push attempt $n failed — retrying in $((n * 3))s..."
              sleep $((n * 3))
            done
          fi
