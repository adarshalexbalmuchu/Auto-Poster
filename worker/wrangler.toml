name = "auto-poster-webhook"
main = "index.js"
compatibility_date = "2024-09-23"

[vars]
GITHUB_REPO = "adarshalexbalmuchu/Auto-Poster"

[observability.logs]
enabled = true

[[kv_namespaces]]
binding = "STATE"
id = "7184454afd984de8b46e788fdf689a2a"

# Per-phone-number conversation state (the "what step is this chat on, what's
# attached" data) lives in a Durable Object instead of KV. KV is only
# eventually consistent across edge locations — a value written by one
# request can read as stale from another for up to ~60s, which was dropping
# image/document attachments made right before "Post it" was tapped. A DO
# gives every read/write for a given phone number a single consistent home.
[[durable_objects.bindings]]
name = "CONVERSATION_STATE"
class_name = "ConversationState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationState"]

[triggers]
# Checks for due scheduled posts (see the `scheduled` handler in index.js).
crons = ["*/15 * * * *"]

# Secrets — set these via: wrangler secret put <NAME>
# WHATSAPP_VERIFY_TOKEN
# WHATSAPP_APP_SECRET      — Meta app secret (Settings → Basic → App Secret)
# WHATSAPP_ACCESS_TOKEN
# WHATSAPP_PHONE_NUMBER_ID
# WHATSAPP_OWNER_NUMBER
# GITHUB_TOKEN
# WORKER_CALLBACK_SECRET   — shared secret for internal callbacks from GitHub Actions
